

name: Build OX Windows VST3

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Check project files
        shell: pwsh
        run: |
          if (!(Test-Path "CMakeLists.txt")) {
            throw "CMakeLists.txt not found in repository root."
          }

      - name: Configure CMake
        run: cmake -S . -B build -A x64

      - name: Build OX
        run: cmake --build build --config Release --parallel

      - name: Locate VST3 plugin
        shell: pwsh
        run: |
          $plugin = Get-ChildItem "build" -Recurse -Directory -Filter "OX.vst3" |
            Select-Object -First 1

          if (!$plugin) {
            throw "OX.vst3 not found. Check the build output and plugin target name."
          }

          New-Item -ItemType Directory -Force -Path "package" | Out-Null
          Copy-Item $plugin.FullName "package/OX.vst3" -Recurse -Force

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: OX-VST3-Windows
          path: package/OX.vst3/
          if-no-files-found: error
          retention-days: 14
          
